services:
  sticky-todo:
    build: .
    image: sticky-todo
    container_name: sticky-todo
    restart: unless-stopped
    # There is no login. Bind to an address only you can reach (Tailscale or LAN IP), not 0.0.0.0.
    ports:
      - "127.0.0.1:3102:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status==200 else 1)\""]
      interval: 1h
      timeout: 10s
      retries: 2
      start_period: 10s
