<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To do</title>
<meta name="theme-color" content="#fde68a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root {
    --paper: #fef3a0;
    --paper-edge: #f6e27a;
    --ink: #3b3417;
    --muted: #8a7d3f;
    --line: rgba(120, 100, 20, .16);
    --accent: #b45309;
    --danger: #b91c1c;
    --warn: #c2410c;
    --c-yellow: #eab308; --c-pink: #ec4899; --c-blue: #3b82f6;
    --c-green: #22c55e; --c-purple: #8b5cf6; --c-orange: #f97316;
    --p-high: #dc2626; --p-medium: #d97706; --p-low: #65a30d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.4 "Segoe Print", "Bradley Hand", "Comic Sans MS", system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .ui { font-family: system-ui, sans-serif; }
  header {
    position: relative;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px 6px 14px;
    background: var(--paper-edge);
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 18px; margin: 0; flex: 1; letter-spacing: .5px; }
  #status { font: 12px system-ui, sans-serif; color: var(--muted); }
  #status.off { color: var(--danger); }
  button {
    font: 14px system-ui, sans-serif; cursor: pointer;
    border: 0; border-radius: 6px; background: transparent; color: var(--muted);
  }
  .icon-btn { font-size: 17px; padding: 3px 6px; line-height: 1; display: inline-flex; align-items: center; }
  .icon-btn[aria-pressed=true] { background: rgba(255,255,255,.55); color: var(--ink); }

  /* Calendar */
  #cal { padding: 6px 12px 8px; border-bottom: 1px solid var(--line); font-family: system-ui, sans-serif; }
  .cal-head { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
  .cal-head strong { flex: 1; text-align: center; font-size: 14px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; max-width: 340px; margin: 0 auto; }
  .cal-head { max-width: 340px; margin: 0 auto 2px; }
  .cal-dow { font-size: 10px; color: var(--muted); text-align: center; text-transform: uppercase; }
  .day {
    position: relative; height: 26px; font-size: 12px; color: var(--ink);
    border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding-top: 2px;
  }
  .day:hover { background: rgba(255,255,255,.45); }
  .day.other { color: var(--muted); opacity: .55; }
  .day.today { box-shadow: inset 0 0 0 1.5px var(--accent); font-weight: 700; }
  .day.sel { background: var(--accent); color: #fff; }
  .day.past-due .n { color: var(--danger); }
  .dots { display: flex; gap: 2px; margin-top: 1px; height: 5px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
  .day.sel .dots i { box-shadow: 0 0 0 1px #fff; }

  /* Add form */
  form#add { padding: 8px 12px 4px; }
  .row { display: flex; gap: 6px; align-items: center; }
  #new {
    flex: 1; min-width: 0;
    font: inherit; color: inherit;
    background: rgba(255,255,255,.45);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 10px; outline: none;
  }
  #new:focus { border-color: var(--accent); background: rgba(255,255,255,.7); }
  #addBtn { background: var(--accent); color: #fff; padding: 0 13px; font-size: 20px; align-self: stretch; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 6px 0 2px; font: 13px system-ui, sans-serif; }
  .opts[hidden] { display: none; }
  input[type=date], input[type=time], select {
    font: 13px system-ui, sans-serif; color: var(--ink);
    background: rgba(255,255,255,.55); border: 1px solid var(--line); border-radius: 5px; padding: 3px 4px;
  }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { padding: 3px 7px; font-size: 12px; border-radius: 0; color: var(--ink); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--ink); color: var(--paper); }
  .swatches { display: inline-flex; gap: 4px; align-items: center; }
  .sw {
    width: 18px; height: 18px; border-radius: 50%; padding: 0;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.15);
  }
  .sw.none { background: repeating-linear-gradient(45deg, transparent 0 3px, var(--line) 3px 5px); }
  .sw.on { outline: 2px solid var(--ink); outline-offset: 1px; }

  /* Sections */
  /* Deadlines and Tasks are stacked, each in its own scroll box. A box takes the height its list
     needs; when both don't fit, both shrink (the longer one more) and scroll separately. */
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 4px 8px 8px; gap: 8px; }
  .cols { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  section {
    flex: 0 1 auto; min-height: 84px; display: flex; flex-direction: column;
    border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.2); overflow: hidden;
  }
  section .scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 2px 4px; }
  section h2 {
    font: 600 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 0; padding: 7px 10px 5px; display: flex; align-items: center; gap: 6px;
    flex: none; border-bottom: 1px solid var(--line); background: rgba(246,226,122,.45);
  }
  section h2 .count { font-weight: 400; }
  section h2 .sub { font-weight: 600; text-transform: none; letter-spacing: 0; font-size: 11px; border-radius: 9px; padding: 0 7px; }
  section h2 .sub.today { background: var(--warn); color: #fff; }
  section h2 .sub.over { background: var(--danger); color: #fff; }
  .chip-filter { text-transform: none; letter-spacing: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 11px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: flex-start; gap: 7px;
    padding: 6px 6px 6px 8px; border-bottom: 1px dashed var(--line);
    border-left: 4px solid transparent; border-radius: 3px;
    touch-action: pan-y; flex-wrap: wrap;
  }
  li[data-color] { background: color-mix(in srgb, var(--c) 12%, transparent); border-left-color: var(--c); }
  li.dragging { opacity: .5; background: rgba(255,255,255,.4); }
  .grip { cursor: grab; color: var(--muted); opacity: .45; padding: 2px 0; user-select: none; touch-action: none; }
  li:hover .grip { opacity: 1; }
  input[type=checkbox] { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--accent); flex: none; cursor: pointer; }
  .body { flex: 1; min-width: 0; }
  .text { display: block; overflow-wrap: anywhere; outline: none; border-radius: 4px; padding: 0 2px; cursor: text; }
  .text a, .meta a { color: var(--accent); }
  .text[contenteditable=true] { background: rgba(255,255,255,.7); }
  .meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; font: 11px/1.5 system-ui, sans-serif; color: var(--muted); }
  .meta:empty { display: none; }
  .pill { border-radius: 9px; padding: 0 7px; background: rgba(255,255,255,.5); white-space: nowrap; }
  .pill.course { background: transparent; border: 1px solid var(--line); }
  /* Deadline urgency: within a week the pill turns red; the last two days and overdue are solid. */
  .pill.due.week { background: #fee2e2; color: var(--danger); font-weight: 600; }
  .pill.due.soon, .pill.due.today, .pill.due.over { background: var(--danger); color: #fff; font-weight: 600; }
  /* ...and the row glows red, pulsing gently in the last two days. */
  li.urgent { box-shadow: inset 0 0 0 1px rgba(220,38,38,.45), 0 0 10px rgba(220,38,38,.28); background-color: rgba(254,226,226,.55); }
  li.urgent.hot { animation: glow 2.4s ease-in-out infinite; }
  @keyframes glow {
    0%, 100% { box-shadow: inset 0 0 0 1px rgba(220,38,38,.5), 0 0 6px rgba(220,38,38,.25); }
    50% { box-shadow: inset 0 0 0 1.5px rgba(220,38,38,.85), 0 0 14px rgba(220,38,38,.5); }
  }
  @media (prefers-reduced-motion: reduce) { li.urgent.hot { animation: none; } }
  /* Settings menu under the gear button. */
  #settings { position: absolute; right: 8px; top: 40px; z-index: 5; min-width: 210px; padding: 8px 12px;
    background: #fffbe6; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgba(60,50,10,.18);
    font: 13px system-ui, sans-serif; }
  #settings[hidden] { display: none; }
  #settings label { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
  #settings input { accent-color: var(--accent); }
  .pill.prio { color: #fff; }
  .pill.prio.high { background: var(--p-high); }
  .pill.prio.medium { background: var(--p-medium); }
  .pill.prio.low { background: var(--p-low); }
  .pill.tag { background: transparent; color: var(--accent); cursor: pointer; padding: 0 3px; }
  .pill.tag:hover, .pill.tag.on { text-decoration: underline; }
  .pill.effort { background: transparent; padding: 0 2px; }
  .pill.ai::after { content: " ✨"; font-size: 9px; }
  /* Tag filter bar: one scrolling row of the tags in use. */
  #tagbar { display: flex; gap: 5px; overflow-x: auto; padding: 2px 12px 4px; scrollbar-width: none; font: 12px system-ui, sans-serif; }
  #tagbar::-webkit-scrollbar { display: none; }
  #tagbar[hidden] { display: none; }
  #tagbar button { flex: none; border: 1px solid var(--line); border-radius: 11px; padding: 2px 9px; color: var(--ink); background: rgba(255,255,255,.35); font-size: 12px; }
  #tagbar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #tagbar button small { color: inherit; opacity: .6; margin-left: 3px; }
  .details { font: 12px/1.35 system-ui, sans-serif; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere;
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  li.done .text { text-decoration: line-through; color: var(--muted); }
  .del { opacity: 0; font-size: 15px; padding: 0 4px; }
  li:hover .del, li:focus-within .del { opacity: .8; }
  /* The edit button is always visible (faint until hovered); it opens the task's settings. */
  .more { font-size: 15px; padding: 0 4px; opacity: .5; }
  li:hover .more, li.menu .more { opacity: 1; color: var(--accent); }
  .del:hover { color: var(--danger); }
  @media (hover: none) { .del { opacity: .5; } .more { opacity: .7; } .grip { opacity: .6; } }
  .field { display: flex; align-items: center; gap: 8px; flex-basis: 100%; min-width: 0; }
  .field > span:first-child { flex: none; width: 58px; color: var(--muted); font-size: 12px; }
  .field input.txt { flex: 1; min-width: 0; font: 13px system-ui, sans-serif; color: var(--ink);
    background: rgba(255,255,255,.55); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
  .field input.txt:invalid { border-color: var(--danger); }
  .editor { flex-basis: 100%; padding: 6px 0 2px 25px; }
  .empty { text-align: center; color: var(--muted); padding: 14px 0; font-size: 14px; }
  details { flex: none; max-height: 35%; overflow-y: auto; padding: 0 8px; }
  summary { font: 13px system-ui, sans-serif; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 8px; }
  summary button { margin-left: auto; text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1>To do</h1>
  <button class="icon-btn" id="calBtn" title="Calendar" aria-label="Calendar" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg></button>
  <span id="status">…</span>
  <button class="icon-btn" id="setBtn" title="Settings" aria-label="Settings" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
  <div id="settings" hidden>
    <label><input type="checkbox" id="optTags"> Show tags</label>
  </div>
</header>
<div id="cal" hidden>
  <div class="cal-head">
    <button class="icon-btn" id="prevM" aria-label="Previous month">‹</button>
    <strong id="calTitle"></strong>
    <button class="icon-btn" id="nextM" aria-label="Next month">›</button>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</div>
<form id="add" autocomplete="off">
  <div class="row">
    <input id="new" placeholder="Add a task…" maxlength="500" enterkeyhint="done">
    <button type="button" class="icon-btn" id="optBtn" title="Date, priority, colour, tags, time" aria-label="Options" aria-pressed="false">⚑</button>
    <button id="addBtn" aria-label="Add">+</button>
  </div>
  <div class="opts" id="opts" hidden></div>
</form>
<div id="tagbar" hidden></div>
<main>
  <div class="cols">
    <section id="dlSec">
      <h2>Deadlines <span class="count" id="dlCount"></span><span id="dlToday"></span><span id="dayFilter"></span></h2>
      <div class="scroll">
        <ul id="deadlines"></ul>
        <p class="empty" id="dlEmpty" hidden></p>
      </div>
    </section>
    <section id="tkSec">
      <h2>Tasks <span class="count" id="tkCount"></span></h2>
      <div class="scroll">
        <ul id="tasks"></ul>
        <p class="empty" id="tkEmpty" hidden>Nothing to do 🎉</p>
      </div>
    </section>
  </div>
  <details id="doneBox" hidden>
    <summary><span id="doneCount"></span><button type="button" id="clear">Clear</button></summary>
    <ul id="done"></ul>
  </details>
</main>
<script>
const $ = (s) => document.querySelector(s);
const COLORS = ['yellow', 'pink', 'blue', 'green', 'purple', 'orange'];
const PRIOS = [['high', 'High'], ['medium', 'Med'], ['low', 'Low']];
const PRANK = { high: 0, medium: 1, low: 2 };
let state = { version: -1, todos: [] };
let editing = null;      // id whose text is being edited: skip re-render so typing isn't clobbered
let dragging = false;
let menuId = null;       // id whose detail editor is open
let selDay = null;       // YYYY-MM-DD picked on the calendar
let tagFilter = null;    // tag picked in the tag bar: both lists show only tasks with it
let aiOn = false;        // server has Claude tagging switched on
let showTags = true;     // tags (only ones you added) show unless switched off in settings
let calMonth = monthStart(new Date());
const draft = { due: '', due_time: '', priority: null, color: null, tags: '', effort_min: null };  // options for the next new task

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// ---------- dates (all local time) ----------
function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function monthStart(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
const todayISO = () => iso(new Date());
const daysUntil = (s) => Math.round((parseISO(s) - parseISO(todayISO())) / 864e5);
const fmtDay = (s) => parseISO(s).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });

function dueLabel(t) {
  const n = daysUntil(t.due);
  const time = t.due_time ? ' ' + t.due_time : '';
  if (n < 0) return [`Overdue · ${fmtDay(t.due)}`, 'over'];
  if (n === 0) return ['Today' + time, 'today'];
  if (n === 1) return ['Tomorrow' + time, 'soon'];
  if (n < 7) return [parseISO(t.due).toLocaleDateString(undefined, { weekday: 'long' }) + time, n <= 2 ? 'soon' : 'week'];
  if (n === 7) return ['In a week · ' + fmtDay(t.due) + time, 'week'];
  return [fmtDay(t.due) + time, ''];
}

const byDue = (a, b) =>
  a.due.localeCompare(b.due) ||
  (a.due_time || '99').localeCompare(b.due_time || '99') ||
  (PRANK[a.priority] ?? 3) - (PRANK[b.priority] ?? 3);

// ---------- sync ----------
function setStatus(ok) {
  const s = $('#status');
  s.textContent = ok ? 'synced' : 'offline';
  s.className = ok ? '' : 'off';
}

async function api(method, path, body) {
  try {
    const r = await fetch(path, {
      method, headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!r.ok) throw new Error(r.status);
    const next = await r.json();
    setStatus(true);
    if (next.version !== state.version) { state = next; render(); }
  } catch { setStatus(false); }
}
const patch = (id, body) => api('PATCH', '/api/todos/' + id, body);
const refresh = () => { if (!editing && !dragging) api('GET', '/api/todos'); };

// ---------- shared option controls (used by the add form and the per-task editor) ----------
function el(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids);
  return e;
}

function optionControls(vals, onChange) {
  const date = el('input', { type: 'date', value: vals.due || '', title: 'Due date' });
  const time = el('input', { type: 'time', value: vals.due_time || '', title: 'Due time', disabled: !vals.due });
  date.onchange = () => { time.disabled = !date.value; onChange({ due: date.value || null, ...(date.value ? {} : { due_time: null }) }); };
  time.onchange = () => onChange({ due_time: time.value || null });
  const clearDate = el('button', { type: 'button', textContent: '✕', title: 'No due date', className: 'icon-btn' });
  clearDate.onclick = () => { date.value = time.value = ''; time.disabled = true; onChange({ due: null, due_time: null }); };

  const seg = el('span', { className: 'seg', title: 'Priority' });
  for (const [k, label] of PRIOS) {
    const b = el('button', { type: 'button', textContent: label, className: vals.priority === k ? 'on' : '' });
    b.onclick = () => {
      const on = !b.classList.contains('on');
      seg.querySelectorAll('button').forEach((x) => x.classList.remove('on'));
      b.classList.toggle('on', on);
      onChange({ priority: on ? k : null });
    };
    seg.append(b);
  }

  const sw = el('span', { className: 'swatches', title: 'Colour' });
  for (const c of [null, ...COLORS]) {
    const b = el('button', { type: 'button', className: 'sw' + (c ? '' : ' none') + ((vals.color || null) === c ? ' on' : ''),
                             title: c || 'No colour', ariaLabel: c || 'No colour' });
    if (c) b.style.background = `var(--c-${c})`;
    b.onclick = () => { sw.querySelectorAll('.sw').forEach((x) => x.classList.remove('on')); b.classList.add('on'); onChange({ color: c }); };
    sw.append(b);
  }
  const tags = el('input', { className: 'txt', value: Array.isArray(vals.tags) ? vals.tags.join(', ') : vals.tags || '',
                             placeholder: 'e.g. dsa, lab' });
  tags.onchange = () => onChange({ tags: tags.value });
  const est = el('input', { className: 'txt', value: vals.effort_min ? fmtEffort(vals.effort_min) : '', placeholder: 'e.g. 45m, 2h' });
  est.onchange = () => {
    const m = parseEffort(est.value);
    est.setCustomValidity(m === undefined ? 'Use 45m, 2h or 1h30m' : '');
    if (m === undefined) return est.reportValidity();
    onChange({ effort_min: m });
  };
  // A div, not a <label>: clicking a label would press the first button inside it (e.g. "High").
  const field = (label, ...kids) => el('div', { className: 'field' }, el('span', { textContent: label }), ...kids);
  return [
    field('Due', date, time, clearDate),
    field('Priority', seg),
    field('Colour', sw),
    field('Tags', tags),
    field('Time', est),
  ];
}

/** "45m" / "2h" / "1.5h" / "1h30m" / "90" -> minutes; "" -> null; anything else -> undefined. */
function parseEffort(v) {
  v = v.trim().toLowerCase();
  if (!v) return null;
  const m = v.match(/^(?:(\d+(?:\.\d+)?)\s*h)?\s*(?:(\d+)\s*m?)?$/);
  if (!m || !(m[1] || m[2])) return undefined;
  const mins = Math.round(parseFloat(m[1] || 0) * 60) + parseInt(m[2] || 0, 10);
  return mins >= 1 && mins <= 6000 ? mins : undefined;
}

function renderDraftOpts() {
  $('#opts').replaceChildren(...optionControls(draft, (ch) => Object.assign(draft, ch)));
}

// ---------- list items ----------
function item(t, { grip = false } = {}) {
  const li = el('li');
  li.dataset.id = t.id;
  if (t.done) li.classList.add('done');
  if (t.color) { li.dataset.color = t.color; li.style.setProperty('--c', `var(--c-${t.color})`); }
  if (menuId === t.id) li.classList.add('menu');
  if (t.due && !t.done) {
    const n = daysUntil(t.due);
    if (n <= 7) li.classList.add('urgent');   // a week out: start glowing red
    if (n <= 2) li.classList.add('hot');      // last two days and overdue: pulse
  }

  const text = el('span', { className: 'text' });
  setText(text, t.text);
  const meta = el('div', { className: 'meta' });
  const ai = new Set(t.ai_set || []);
  const aiTitle = { title: 'Set by AI. Change it and it stays yours.' };
  if (t.priority) meta.append(el('span', { className: `pill prio ${t.priority}${ai.has('priority') ? ' ai' : ''}`, textContent: PRIOS.find((p) => p[0] === t.priority)[1], ...(ai.has('priority') ? aiTitle : {}) }));
  if (t.due) { const [label, cls] = t.done ? [fmtDay(t.due), ''] : dueLabel(t); meta.append(el('span', { className: `pill due ${cls}${ai.has('due') ? ' ai' : ''}`, textContent: label, ...(ai.has('due') ? aiTitle : {}) })); }
  if (t.course) meta.append(el('span', { className: 'pill course', textContent: t.course }));
  for (const tag of showTags ? t.tags || [] : []) {
    const b = el('span', { className: 'pill tag' + (tag === tagFilter ? ' on' : ''), textContent: '#' + tag, title: 'Show only #' + tag });
    b.dataset.tag = tag;
    meta.append(b);
  }
  if (t.effort_min && !t.done) meta.append(el('span', { className: 'pill effort', textContent: '~' + fmtEffort(t.effort_min), title: 'Time estimate' }));
  if (t.link) meta.append(el('a', { href: t.link, target: '_blank', rel: 'noopener', textContent: '🔗 open' }));
  const body = el('div', { className: 'body' }, text, meta);
  if (t.details) body.append(el('div', { className: 'details', textContent: t.details, title: t.details }));

  if (grip && !t.done) li.append(el('span', { className: 'grip', title: 'Drag to reorder', textContent: '⋮⋮' }));
  li.append(
    el('input', { type: 'checkbox', className: 'done-box', checked: t.done, ariaLabel: 'Done' }),
    body,
    el('button', { className: 'more', title: 'Edit: date, priority, colour, tags, time', ariaLabel: 'Edit', textContent: '✎' }),
    el('button', { className: 'del', title: 'Delete', ariaLabel: 'Delete', textContent: '✕' }),
  );
  if (menuId === t.id) {
    const editor = el('div', { className: 'editor opts' }, ...optionControls(t, (ch) => patch(t.id, ch)));
    // Enter in a text field saves it (change fires on blur) instead of doing nothing.
    editor.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.classList.contains('txt')) { e.preventDefault(); e.target.blur(); } });
    li.append(editor);
  }
  return li;
}

// Plain text with http(s) URLs turned into links (text stays the source of truth for editing).
function setText(el, text) {
  const nodes = [];
  let last = 0;
  for (const m of text.matchAll(/https?:\/\/\S+/g)) {
    if (m.index > last) nodes.push(text.slice(last, m.index));
    const a = document.createElement('a');
    a.href = m[0]; a.textContent = m[0]; a.target = '_blank'; a.rel = 'noopener';
    nodes.push(a);
    last = m.index + m[0].length;
  }
  if (last < text.length) nodes.push(text.slice(last));
  el.replaceChildren(...nodes);
}

// ---------- calendar ----------
function renderCal() {
  if ($('#cal').hidden) return;
  $('#calTitle').textContent = calMonth.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  const byDay = {};
  for (const t of state.todos) if (t.due && !t.done) (byDay[t.due] ||= []).push(t);
  const grid = $('#calGrid');
  const cells = [];
  const first = (calMonth.getDay() + 6) % 7;  // weeks start on Monday
  for (const d of ['M', 'T', 'W', 'T', 'F', 'S', 'S']) cells.push(el('div', { className: 'cal-dow', textContent: d }));
  const start = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1 - first);
  const today = todayISO();
  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    if (i >= 35 && d.getMonth() !== calMonth.getMonth()) break;
    const key = iso(d);
    const tasks = (byDay[key] || []).sort(byDue);
    const cls = ['day'];
    if (d.getMonth() !== calMonth.getMonth()) cls.push('other');
    if (key === today) cls.push('today');
    if (key === selDay) cls.push('sel');
    if (tasks.length && key < today) cls.push('past-due');
    const dots = el('span', { className: 'dots' });
    for (const t of tasks.slice(0, 3)) {
      const c = t.color ? `var(--c-${t.color})` : t.priority ? `var(--p-${t.priority})` : 'var(--muted)';
      dots.append(el('i', { style: `background:${c}` }));
    }
    const b = el('button', { type: 'button', className: cls.join(' '),
                             title: tasks.length ? tasks.map((t) => '• ' + t.text).join('\n') : fmtDay(key) },
                 el('span', { className: 'n', textContent: d.getDate() }), dots);
    b.dataset.day = key;
    cells.push(b);
  }
  grid.replaceChildren(...cells);
}

$('#calGrid').addEventListener('click', (e) => {
  const b = e.target.closest('.day');
  if (!b) return;
  selDay = selDay === b.dataset.day ? null : b.dataset.day;
  // The picked day becomes the due date for the next task added.
  draft.due = selDay || '';
  if (!selDay) draft.due_time = '';
  if (selDay) setOpts(true);
  renderDraftOpts();
  render();
});
$('#prevM').onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); renderCal(); };
$('#nextM').onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); renderCal(); };

function setCal(open) {
  $('#cal').hidden = !open;
  $('#calBtn').setAttribute('aria-pressed', open);
  store.set('calOpen', open ? '1' : '0');
  if (!open && selDay) { selDay = null; draft.due = ''; draft.due_time = ''; renderDraftOpts(); render(); }
  renderCal();
}
$('#calBtn').onclick = () => setCal($('#cal').hidden);

function setOpts(open) {
  $('#opts').hidden = !open;
  $('#optBtn').setAttribute('aria-pressed', open);
}
$('#optBtn').onclick = () => setOpts($('#opts').hidden);

// ---------- render ----------
function render() {
  if (editing || dragging) return;
  const open = state.todos.filter((t) => !t.done);
  const hasTag = (t) => !showTags || !tagFilter || (t.tags || []).includes(tagFilter);
  renderTagbar(open);
  let deadlines = open.filter((t) => t.due && hasTag(t)).sort(byDue);
  const tasks = open.filter((t) => !t.due && hasTag(t));
  const done = state.todos.filter((t) => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));

  const totalDl = deadlines.length;
  if (selDay) deadlines = deadlines.filter((t) => t.due === selDay);
  $('#deadlines').replaceChildren(...deadlines.map((t) => item(t)));
  // No dragging while filtered: the order of the hidden tasks would be ambiguous.
  $('#tasks').replaceChildren(...tasks.map((t) => item(t, { grip: !tagFilter })));
  $('#done').replaceChildren(...done.map((t) => item(t)));

  $('#dlCount').textContent = totalDl ? `(${totalDl})` : '';
  // "Deadlines (8)  Today (4)  Overdue (1)": counts across all deadlines, not just a picked day.
  const allDl = open.filter((t) => t.due && hasTag(t));
  const dueToday = allDl.filter((t) => daysUntil(t.due) === 0).length;
  const overdueN = allDl.filter((t) => daysUntil(t.due) < 0).length;
  $('#dlToday').replaceChildren(
    ...(dueToday ? [el('span', { className: 'sub today', textContent: `Today (${dueToday})` })] : []),
    ...(overdueN ? [el('span', { className: 'sub over', textContent: `Overdue (${overdueN})` })] : []));
  $('#tkCount').textContent = tasks.length ? `(${tasks.length})` : '';
  $('#dayFilter').replaceChildren(...(selDay ? [el('button', { className: 'chip-filter', textContent: fmtDay(selDay) + ' ✕', title: 'Show all deadlines', onclick: () => $(`.day[data-day="${selDay}"]`)?.click() ?? clearDay() })] : []));
  $('#dlEmpty').hidden = deadlines.length > 0;
  $('#dlEmpty').textContent = selDay ? 'Nothing due this day' : 'No deadlines. Give a task a date with ⚑ or the calendar';
  $('#tkEmpty').hidden = tasks.length > 0;
  $('#doneBox').hidden = done.length === 0;
  $('#doneCount').textContent = `Done (${done.length})`;
  const overdue = deadlines.filter((t) => daysUntil(t.due) < 0).length;
  document.title = open.length ? `To do (${open.length}${overdue ? `, ${overdue} overdue` : ''})` : 'To do';
  renderCal();
}
function fmtEffort(m) {
  if (m < 60) return m + 'm';
  const h = m / 60;
  return (h % 1 ? h.toFixed(1) : h) + 'h';
}

function renderTagbar(open) {
  if (!showTags) { $('#tagbar').hidden = true; return; }
  const counts = {};
  for (const t of open) for (const tag of t.tags || []) counts[tag] = (counts[tag] || 0) + 1;
  const tags = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
  if (tagFilter && !counts[tagFilter]) tags.unshift(tagFilter);
  $('#tagbar').hidden = tags.length === 0;
  $('#tagbar').replaceChildren(...tags.map((tag) => {
    const b = el('button', { type: 'button', className: tag === tagFilter ? 'on' : '' }, '#' + tag, el('small', { textContent: counts[tag] || 0 }));
    b.dataset.tag = tag;
    return b;
  }));
}

function setTagFilter(tag) {
  tagFilter = tagFilter === tag ? null : tag;
  store.set('tagFilter', tagFilter || '');
  render();
}
$('#tagbar').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setTagFilter(b.dataset.tag); });

function clearDay() { selDay = null; draft.due = ''; draft.due_time = ''; renderDraftOpts(); render(); }

// ---------- events ----------
$('#add').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = $('#new').value.trim();
  if (!text) return;
  $('#new').value = '';
  const body = { text };
  if (draft.due) { body.due = draft.due; if (draft.due_time) body.due_time = draft.due_time; }
  if (draft.priority) body.priority = draft.priority;
  if (draft.color) body.color = draft.color;
  if (draft.tags && draft.tags.trim()) body.tags = draft.tags;
  if (draft.effort_min) body.effort_min = draft.effort_min;
  api('POST', '/api/todos', body);
  // Keep the picked calendar day for the next task; reset the rest.
  Object.assign(draft, { due: selDay || '', due_time: '', priority: null, color: null, tags: '', effort_min: null });
  renderDraftOpts();
});

$('#clear').addEventListener('click', (e) => {
  e.preventDefault();
  if (confirm('Delete all done tasks?')) api('POST', '/api/todos/clear-done');
});

document.addEventListener('change', (e) => {
  if (!e.target.classList.contains('done-box')) return;  // not the editor's or settings' checkboxes
  const id = e.target.closest('li').dataset.id;
  if (menuId === id) menuId = null;
  patch(id, { done: e.target.checked });
});

document.addEventListener('click', (e) => {
  const li = e.target.closest('li');
  if (!li) return;
  const id = li.dataset.id;
  if (e.target.classList.contains('del')) { if (menuId === id) menuId = null; return api('DELETE', '/api/todos/' + id); }
  if (e.target.classList.contains('more')) { menuId = menuId === id ? null : id; return render(); }
  if (e.target.classList.contains('tag')) return setTagFilter(e.target.dataset.tag);
  if (e.target.classList.contains('text') && editing !== id) startEdit(e.target, id);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && menuId && !editing) { menuId = null; render(); }
});

function startEdit(el, id) {
  editing = id;
  el.contentEditable = 'true';
  el.focus();
  const original = state.todos.find((t) => t.id === id)?.text ?? el.textContent;
  const finish = (save) => {
    el.removeEventListener('keydown', onKey);
    el.contentEditable = 'false';
    editing = null;
    const text = el.textContent.trim();
    if (save && text && text !== original) patch(id, { text });
    else { setText(el, original); refresh(); }
  };
  const onKey = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    if (e.key === 'Escape') { setText(el, original); el.blur(); }
  };
  el.addEventListener('keydown', onKey);
  el.addEventListener('blur', () => finish(true), { once: true });
}

// Drag to reorder undated tasks (pointer events: works with mouse and touch).
// Deadlines are always ordered by date, so they aren't draggable.
$('#tasks').addEventListener('pointerdown', (e) => {
  if (!e.target.classList.contains('grip')) return;
  e.preventDefault();
  const li = e.target.closest('li');
  const list = $('#tasks');
  dragging = true;
  li.classList.add('dragging');
  li.setPointerCapture(e.pointerId);
  const move = (ev) => {
    const over = [...list.children].find((c) => {
      const r = c.getBoundingClientRect();
      return c !== li && ev.clientY > r.top && ev.clientY < r.bottom;
    });
    if (!over) return;
    const r = over.getBoundingClientRect();
    list.insertBefore(li, ev.clientY < r.top + r.height / 2 ? over : over.nextSibling);
  };
  const up = () => {
    li.removeEventListener('pointermove', move);
    li.classList.remove('dragging');
    dragging = false;
    const ids = [...list.children].map((c) => c.dataset.id);
    const rest = state.todos.filter((t) => !ids.includes(t.id)).map((t) => t.id);
    api('POST', '/api/todos/reorder', { ids: [...ids, ...rest] });
  };
  li.addEventListener('pointermove', move);
  li.addEventListener('pointerup', up, { once: true });
  li.addEventListener('pointercancel', up, { once: true });
});

// Re-render at midnight-ish so "Today"/"Overdue" labels stay right on a note left open for days.
let lastDay = todayISO();
setInterval(() => { if (todayISO() !== lastDay) { lastDay = todayISO(); render(); } }, 60_000);

try { if (store.get('doneOpen') === '1') $('#doneBox').open = true; } catch {}
$('#doneBox').addEventListener('toggle', () => store.set('doneOpen', $('#doneBox').open ? '1' : '0'));
renderDraftOpts();
tagFilter = store.get('tagFilter') || null;
showTags = store.get('showTags') !== '0';  // on unless switched off
$('#optTags').checked = showTags;
$('#optTags').onchange = () => {
  showTags = $('#optTags').checked;
  store.set('showTags', showTags ? '1' : '0');
  render();
};
$('#setBtn').onclick = (e) => {
  e.stopPropagation();
  const open = $('#settings').hidden;
  $('#settings').hidden = !open;
  $('#setBtn').setAttribute('aria-expanded', open);
};
document.addEventListener('click', (e) => {
  if (!$('#settings').hidden && !e.target.closest('#settings')) { $('#settings').hidden = true; $('#setBtn').setAttribute('aria-expanded', false); }
});
setCal(store.get('calOpen') === '1');
fetch('/api/ai').then((r) => r.json()).then((a) => { aiOn = !!a.enabled; render(); }).catch(() => {});
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
window.addEventListener('focus', refresh);
setInterval(refresh, 5000);
refresh();
if ('serviceWorker' in navigator && isSecureContext) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
